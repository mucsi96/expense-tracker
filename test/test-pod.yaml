apiVersion: v1
kind: Pod
metadata:
  name: expense-tracker-test
spec:
  containers:
    - name: traefik
      image: docker.io/library/traefik:v3.6
      ports:
        - containerPort: 80
          hostPort: 8160
        - containerPort: 8081
          hostPort: 8161
      volumeMounts:
        - name: traefik-config
          mountPath: /etc/traefik/traefik.yaml
          readOnly: true
        - name: traefik-routes
          mountPath: /etc/traefik/routes.yaml
          readOnly: true
      livenessProbe:
        exec:
          command: ["traefik", "healthcheck", "--ping"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: db
      image: docker.io/library/postgres:17.5-bullseye
      ports:
        - containerPort: 5432
          hostPort: 5461
      env:
        - name: POSTGRES_DB
          value: test
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_USER
          value: postgres
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 5

    - name: mock-oauth2
      image: ghcr.io/mucsi96/mock-oidc-provider:14
      ports:
        - containerPort: 8060
          hostPort: 8060
      env:
        - name: PORT
          value: "8060"
        - name: ISSUER_ID
          value: default
        - name: SUB
          value: test-user
        - name: OID
          value: 00000000-0000-0000-0000-000000000001
        - name: NAME
          value: Test User
        - name: PREFERRED_USERNAME
          value: test-user@example.com
        - name: ROLES
          value: readExpenses,createExpenses,deleteExpenses
        - name: SCP
          value: api-access
        - name: AUD
          value: mock-api-client-id
      livenessProbe:
        httpGet:
          path: /health
          port: 8060
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: mock-exchange-rate
      image: localhost/expense-tracker-mock-exchange-rate:test
      ports:
        - containerPort: 8065
          hostPort: 8065
      env:
        - name: PORT
          value: "8065"
      livenessProbe:
        httpGet:
          path: /health
          port: 8065
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: server
      image: localhost/expense-tracker-server:test
      env:
        - name: PORT
          value: "8064"
        - name: BINDING
          value: "0.0.0.0"
        - name: LOCO_ENV
          value: test
        - name: DATABASE_URL
          value: postgres://postgres:postgres@localhost:5432/test
        - name: OIDC_ISSUER
          value: http://localhost:8060/default
        - name: API_CLIENT_ID
          value: mock-api-client-id
        - name: BANK_NOTIFICATION_TOKEN
          value: test-bank-notification-token
        - name: EXCHANGE_RATE_API_URL
          value: http://localhost:8065/v1
      livenessProbe:
        exec:
          command: ["/app/expense-tracker-server", "--healthcheck"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 30

    - name: client
      image: docker.io/library/nginx:1.31.8
      volumeMounts:
        - name: client-static
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: client-nginx
          mountPath: /etc/nginx/conf.d/default.conf
          readOnly: true
      livenessProbe:
        httpGet:
          path: /
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 2
        failureThreshold: 10

  volumes:
    - name: client-static
      hostPath:
        path: client/dist
        type: Directory
    - name: client-nginx
      hostPath:
        path: client/nginx.conf
        type: File
    - name: traefik-config
      hostPath:
        path: test/traefik.yaml
        type: File
    - name: traefik-routes
      hostPath:
        path: test/traefik-routes.yaml
        type: File
