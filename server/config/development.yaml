logger:
  enable: true
  level: info
  format: compact
server:
  binding: <%= get_env(name="BINDING", default="127.0.0.1") %>
  port: <%= get_env(name="PORT", default="8063") %>
  host: http://localhost
  middlewares:
    etag:
      enable: false
    fallback:
      enable: false
    secure_headers:
      enable: true
      preset: empty
      overrides:
        Cache-Control: no-store
        X-Content-Type-Options: nosniff
workers:
  mode: BackgroundAsync
database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  min_connections: 1
  max_connections: 10
  connect_timeout: 30000
  idle_timeout: 300000
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
  run_on_start: CREATE SCHEMA IF NOT EXISTS expensetracker
settings:
  oidc:
    issuer: <%= get_env(name="OIDC_ISSUER") %>
    audience: <%= get_env(name="API_CLIENT_ID") %>
  bank_notification_token: <%= get_env(name="BANK_NOTIFICATION_TOKEN") %>
  base_currency: <%= get_env(name="BASE_CURRENCY", default="CHF") %>
  exchange_rate_api_url: https://api.frankfurter.dev/v1
