databaseChangeLog:
  - changeSet:
      id: 1-create-expenses-table
      author: mucsi96
      changes:
        - createTable:
            tableName: expenses
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: expense_date
                  type: timestamptz
              - column:
                  name: description
                  type: text
              - column:
                  name: location
                  type: text
              - column:
                  name: category
                  type: text
              - column:
                  name: amount
                  type: numeric(19, 4)
              - column:
                  name: currency
                  type: text
              - column:
                  name: method
                  type: text
              - column:
                  name: type
                  type: text
              - column:
                  name: comment
                  type: text
  - changeSet:
      id: 2-add-converted-amount
      author: mucsi96
      changes:
        - addColumn:
            tableName: expenses
            columns:
              - column:
                  name: converted_amount
                  type: numeric(19, 4)
              - column:
                  name: base_currency
                  type: text
        - update:
            tableName: expenses
            columns:
              - column:
                  name: converted_amount
                  valueComputed: amount
              - column:
                  name: base_currency
                  valueComputed: currency
            where: converted_amount IS NULL
  - changeSet:
      id: 3-create-categories-table
      author: mucsi96
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
                    unique: true
        - sql:
            sql: >-
              INSERT INTO expensetracker.categories (name)
              SELECT DISTINCT category FROM expensetracker.expenses
              WHERE category IS NOT NULL AND category <> ''
  - changeSet:
      id: 4-add-category-emoji-and-description
      author: mucsi96
      changes:
        - addColumn:
            tableName: categories
            columns:
              - column:
                  name: emoji
                  type: text
              - column:
                  name: description
                  type: text
  - changeSet:
      id: 5-create-merchant-categories-table
      author: mucsi96
      changes:
        - createTable:
            tableName: merchant_categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: merchant
                  type: text
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: category
                  type: text
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              INSERT INTO expensetracker.merchant_categories (merchant, category)
              SELECT description, MIN(category) FROM expensetracker.expenses
              WHERE description IS NOT NULL AND description <> ''
              AND category IS NOT NULL AND category <> ''
              GROUP BY description
              HAVING COUNT(DISTINCT category) = 1
