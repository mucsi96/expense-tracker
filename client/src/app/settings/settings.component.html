<div class="page-header">
  <h1>Settings</h1>
</div>

<section class="settings-section">
  <h2>Categories</h2>
  <p>Manage the categories used to group your transactions.</p>
  <a mat-flat-button routerLink="/settings/categories">Manage categories</a>
</section>

<section class="danger-zone">
  <h2>Danger zone</h2>
  <p>
    Remove all imported transactions from the database. This action cannot be
    undone.
  </p>
  <button
    mat-flat-button
    class="cleanup-button"
    [disabled]="cleaningUp()"
    (click)="cleanupDatabase()"
  >
    Clear all transactions
  </button>
</section>
