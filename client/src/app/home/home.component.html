<div class="page-header">
  <h1>Expenses</h1>
  <button mat-flat-button [disabled]="uploading()" (click)="fileInput.click()">
    Upload statement
  </button>
  <input
    hidden
    type="file"
    accept=".csv"
    #fileInput
    (change)="onFileSelected($event)"
  />
</div>

@if (insight.isLoading()) {
<bt-bar-loader class="insight-loading" label="Loading insight" />
} @else if (insight.value()) {
<mat-card class="insight">
  <mat-card-content>
    <p class="insight-text">{{ insight.value()?.insight }}</p>
  </mat-card-content>
</mat-card>
}

@if (expenses.isLoading() || uploading()) {
<bt-bar-loader class="page-loading" label="Loading expenses" />
} @else if (expenses.value()?.length) {
<ag-grid-angular
  class="expenses-grid"
  [theme]="theme"
  [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef"
  [rowData]="expenses.value()"
  (gridReady)="onGridReady($event)"
/>
} @else {
<p class="empty-state">No expenses yet. Upload a bank statement to get started.</p>
}
