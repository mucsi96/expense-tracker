<div class="page-header">
  <h1>Expenses</h1>
</div>

@if (expenses.isLoading() || uploading()) {
<bt-bar-loader class="page-loading" label="Loading expenses" />
} @else {
<div
  class="dropzone"
  [class.drag-over]="dragOver()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  @if (expenses.value()?.length) {
  <ag-grid-angular
    class="expenses-grid"
    [theme]="theme"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [rowData]="expenses.value()"
    (gridReady)="onGridReady($event)"
  />
  } @else {
  <p class="empty-state">
    No expenses yet. Drop a bank statement CSV here to get started.
  </p>
  }
  @if (dragOver()) {
  <div class="drop-overlay">Drop CSV statement to import</div>
  }
</div>
}
